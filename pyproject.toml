[project]
name = "clips-courier"
version = "0.1.0"
description = "Telegram bot that delivers short videos into the chat"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "aiosqlite==0.22.1",
    "python-dotenv==1.2.3",
    "yt-dlp==2026.8.19",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "pyhamcrest==2.1.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-fail-slow==0.6.0",
    "pytest-randomly==4.1.0",
    "ruff>=0.16.5",
]

[tool.black]
target-version = ["py312", "py313"]

[tool.coverage.report]
exclude_also = ["@(abc\\.)?abstractmethod"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--fail-slow=2s"
